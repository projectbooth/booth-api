# Default values for booth-api.
#
# What this module is (ADR 0100): turns a catalog dataset into a read-only REST + GraphQL API,
# reachable by holders of an API key this module issues, hashes, scopes to datasets and revokes.
#
# Built so far: the management API behind the module's UI (generate API definitions, issue and
# revoke keys). Not yet: the generated endpoints on core's public routes (ADR 0101, waiting on
# core) and the credential-sidecar path for reading workspace data (ADR 0103, waiting on core's
# confirmation of the minting bound), so generating an API answers 503 for now.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-api
  tag: "" # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

service:
  port: 8080

oidc:
  # The management API verifies each caller's token itself (ADR 0041), against the same OIDC
  # provider and client booth-core uses. Left empty, the API answers 503.
  issuerUrl: ""
  clientId: ""
  requireAudience: true
  # Must match booth-core's BOOTH_OIDC_GROUPS_CLAIM (ADR 0025).
  groupsClaim: groups

core:
  # booth-core's in-cluster base URL, e.g. http://booth-core.booth-system.svc.cluster.local:8080.
  # booth-api reads catalog datasets through core's gateway with the caller's own token (ADR 0007).
  # Empty: generating an API fails with a clear error; key management still works.
  url: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}

serviceAccount:
  create: true
  name: ""
