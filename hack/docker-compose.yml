# The real PostgreSQL the test suite runs against: the module's own store, and the fixture table
# introspection is tested on. Same image booth-core bundles. Usage:
#   docker compose -f hack/docker-compose.yml up -d --wait
#   eval "$(sh hack/test-env.sh)"
# The project is named so that it doesn't default to the folder name, "hack": every sibling repo
# keeps its compose file in hack/ too, and two projects of the same name replace each other's
# containers.
name: booth-api-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booth_test
      POSTGRES_PASSWORD: booth-test
      POSTGRES_DB: booth_test
    ports: ["15443:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth_test -d booth_test"]
      interval: 2s
      timeout: 5s
      retries: 30
