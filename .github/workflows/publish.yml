name: Publish UI package

# ADR 0030: booth-design consumes @projectbooth/api-ui as an ordinary, exact-pinned npm dependency,
# published to GitHub Packages (npm.pkg.github.com) like every other native module's UI package.
# Triggered by an `api-ui-v*` tag whose version matches web/package.json.
on:
  push:
    tags:
      - "api-ui-v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@projectbooth"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="api-ui-v$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "$want" ] || { echo "tag ${GITHUB_REF_NAME} != $want"; exit 1; }
      - name: Typecheck, lint, test (don't publish something CI hasn't verified)
        run: |
          npm run typecheck
          npm run lint
          npm test -- --run
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
