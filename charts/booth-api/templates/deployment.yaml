apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-api.fullname" . }}
  labels:
    {{- include "booth-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booth-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "booth-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "booth-api.serviceAccountName" . }}
      # The module never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: booth-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOOTH_HTTP_ADDR
              value: ":8080"
            # ADR 0053: booth-core writes this Secret into the module's namespace because the
            # manifest declares `database`. The pod may sit in CreateContainerConfigError for a
            # moment after install until core has written it.
            - name: BOOTH_API_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: booth-database-credentials
                  key: dsn
            {{- with .Values.core.url }}
            - name: BOOTH_CORE_URL
              value: {{ . | quote }}
            # ADR 0103: written by core because the manifest declares workloadIdentity.mint. The
            # pod may wait in CreateContainerConfigError until core has written it.
            - name: BOOTH_WORKLOAD_MINT_URL
              valueFrom:
                secretKeyRef:
                  name: booth-workload-minting-credentials
                  key: url
            - name: BOOTH_WORKLOAD_MINT_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: booth-workload-minting-credentials
                  key: credential
            - name: BOOTH_SIDECAR_DIR
              value: /run/booth-api/sidecars
            - name: BOOTH_SIDECAR_IDLE
              value: {{ $.Values.dataAccess.idle | quote }}
            {{- end }}
            {{- with .Values.oidc.issuerUrl }}
            # The management API verifies tokens itself (ADR 0041).
            - name: BOOTH_OIDC_ISSUER_URL
              value: {{ . | quote }}
            - name: BOOTH_OIDC_CLIENT_ID
              value: {{ required "oidc.clientId is required when oidc.issuerUrl is set" $.Values.oidc.clientId | quote }}
            - name: BOOTH_OIDC_REQUIRE_AUDIENCE
              value: {{ $.Values.oidc.requireAudience | quote }}
            - name: BOOTH_OIDC_GROUPS_CLAIM
              value: {{ $.Values.oidc.groupsClaim | quote }}
            {{- end }}
            {{- with .Values.oidc.jwksUrl }}
            # ADR 0108 key-fetch override. Rendered even without issuerUrl, so that mistake fails
            # at startup instead of being silently ignored.
            - name: BOOTH_OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
          # /livez never touches PostgreSQL (a restart can't fix an outage); /healthz does, and
          # is what core polls.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- if .Values.core.url }}
          # Token files and Unix sockets for the per-workspace sidecars: in memory, private to
          # this pod, gone when it stops (the root filesystem is read-only).
          volumeMounts:
            - name: sidecars
              mountPath: /run/booth-api
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.core.url }}
      volumes:
        - name: sidecars
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- end }}
