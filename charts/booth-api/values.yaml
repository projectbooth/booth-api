# Default values for booth-api.
#
# What this module is (ADR 0100): turns a catalog dataset into a REST + GraphQL API, readable by
# holders of an API key this module issues, hashes, scopes to datasets and revokes, and writable by
# booth-streamlit apps a workspace owner grants (ADR 0117; docs/contracts/app-writes.md).
#
# The management API behind the module's UI (generate APIs, issue and revoke keys) and the
# generated endpoints on core's public route (ADR 0101). Reading workspace data (ADR 0103) needs
# core.url: the chart then declares workloadIdentity.mint and booth-api runs a credential sidecar
# per workspace and key creator. Without it, data requests answer 503.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-api
  tag: "" # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

service:
  port: 8080

oidc:
  # The management API verifies each caller's token itself (ADR 0041), against the same OIDC
  # provider and client booth-core uses. Left empty, the API answers 503.
  issuerUrl: ""
  clientId: ""
  requireAudience: true
  # Must match booth-core's BOOTH_OIDC_GROUPS_CLAIM (ADR 0025).
  groupsClaim: groups
  # ADR 0108: fetch signing keys from this URL instead of the issuer's discovery document; `iss`
  # is still checked exactly against issuerUrl. The bundled install points it at Keycloak's
  # in-cluster Service over plain http. Empty (default): discovery. Requires issuerUrl.
  jwksUrl: ""
  # ADR 0117: booth-core's workload issuer (its in-cluster URL, the `iss` of the tokens it mints).
  # App write tokens on /app/v1/ are verified against it, never against issuerUrl. Empty: app
  # writes answer 503. Requires clientId. Core's install API fills it (identity keys, ADR 0113).
  workloadIssuerUrl: ""

core:
  # booth-core's in-cluster base URL, e.g. http://booth-core.booth-system.svc.cluster.local:8080.
  # booth-api reads catalog datasets through core's gateway with the caller's own token (ADR 0007).
  # Empty: generating an API fails with a clear error and data requests answer 503; key management
  # still works.
  url: ""

dataAccess:
  # A workspace's credential sidecar is stopped after this long with no request (it starts again
  # on the next one, which then waits a few seconds for a lease). Write sidecars too.
  idle: 10m

writes:
  # ADR 0117: per-app write rate limit (a token bucket per app, per pod) and how long the write
  # audit log (who wrote what, when; never row values) is kept.
  ratePerSecond: 10
  burst: 50
  auditRetention: 2160h # 90 days

# ADR 0123: booth-api publishes api.write.committed on the event bus (NATS, ADR 0021), one per
# committed app write, so a pipeline can be triggered by it. The event names the API, its dataset
# and table, the operation and the app; never row values. The BoothModule declares
# `events: {publish: [api.write.committed]}`, and booth-core answers by writing the
# booth-event-bus-credentials Secret (a credential scoped to exactly that, plus the bus's in-cluster
# URL) into this namespace and admitting the namespace to NATS. The pod mounts it and waits until it
# exists, as booth-database does. Events wait in booth-api's own database while the bus is down, and
# are dropped after 24 hours undelivered.
eventBus:
  # false leaves the bus out entirely: no `events` on the manifest, no credential, no connection.
  # Writes still work; no pipeline is triggered by them.
  enabled: true
  credentialsSecret:
    # Read the credential from booth-core's Secret (the normal case). Set false only against a bus
    # with authentication off (a test stand-in), and then nats.url is required.
    enabled: true
    # The name booth-core gives it (ADR 0050).
    name: booth-event-bus-credentials

nats:
  # Overrides the bus URL from the credentials Secret. Required only when
  # eventBus.credentialsSecret.enabled is false.
  url: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}

serviceAccount:
  create: true
  name: ""
