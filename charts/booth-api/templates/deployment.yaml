apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-api.fullname" . }}
  labels:
    {{- include "booth-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booth-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "booth-api.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "booth-api.serviceAccountName" . }}
      # The module never calls the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: booth-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BOOTH_HTTP_ADDR
              value: ":8080"
            # ADR 0053: booth-core writes this Secret into the module's namespace because the
            # manifest declares `database`. The pod may sit in CreateContainerConfigError for a
            # moment after install until core has written it.
            - name: BOOTH_API_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: booth-database-credentials
                  key: dsn
            {{- with .Values.core.url }}
            - name: BOOTH_CORE_URL
              value: {{ . | quote }}
            # ADR 0103: written by core because the manifest declares workloadIdentity.mint. The
            # pod may wait in CreateContainerConfigError until core has written it.
            - name: BOOTH_WORKLOAD_MINT_URL
              valueFrom:
                secretKeyRef:
                  name: booth-workload-minting-credentials
                  key: url
            - name: BOOTH_WORKLOAD_MINT_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: booth-workload-minting-credentials
                  key: credential
            - name: BOOTH_SIDECAR_DIR
              value: /run/booth-api/sidecars
            - name: BOOTH_SIDECAR_IDLE
              value: {{ $.Values.dataAccess.idle | quote }}
            {{- end }}
            {{- with .Values.oidc.issuerUrl }}
            # The management API verifies tokens itself (ADR 0041).
            - name: BOOTH_OIDC_ISSUER_URL
              value: {{ . | quote }}
            - name: BOOTH_OIDC_CLIENT_ID
              value: {{ required "oidc.clientId is required when oidc.issuerUrl is set" $.Values.oidc.clientId | quote }}
            - name: BOOTH_OIDC_REQUIRE_AUDIENCE
              value: {{ $.Values.oidc.requireAudience | quote }}
            - name: BOOTH_OIDC_GROUPS_CLAIM
              value: {{ $.Values.oidc.groupsClaim | quote }}
            {{- end }}
            {{- with .Values.oidc.workloadIssuerUrl }}
            # ADR 0117: app write tokens are verified against core's workload issuer.
            - name: BOOTH_OIDC_WORKLOAD_ISSUER_URL
              value: {{ . | quote }}
            {{- end }}
            - name: BOOTH_WRITES_RATE
              value: {{ .Values.writes.ratePerSecond | quote }}
            - name: BOOTH_WRITES_BURST
              value: {{ .Values.writes.burst | quote }}
            - name: BOOTH_WRITES_AUDIT_RETENTION
              value: {{ .Values.writes.auditRetention | quote }}
            {{- if .Values.eventBus.enabled }}
            {{- if .Values.eventBus.credentialsSecret.enabled }}
            # ADR 0123: the credential booth-core minted for this module's declared `events`
            # (ADR 0050). The file is re-read on every reconnect, so core's in-place renewal is
            # picked up.
            - name: BOOTH_NATS_CREDS_FILE
              value: /etc/booth/event-bus/nats.creds
            {{- if .Values.nats.url }}
            - name: BOOTH_NATS_URL
              value: {{ .Values.nats.url | quote }}
            {{- else }}
            - name: BOOTH_NATS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.eventBus.credentialsSecret.name }}
                  key: url
            {{- end }}
            {{- else }}
            - name: BOOTH_NATS_URL
              value: {{ required "nats.url is required when eventBus.credentialsSecret.enabled is false: with no credentials Secret to take the address from, the event bus has nowhere to connect (set eventBus.enabled=false to leave the event bus out on purpose)" .Values.nats.url | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.oidc.jwksUrl }}
            # ADR 0108 key-fetch override. Rendered even without issuerUrl, so that mistake fails
            # at startup instead of being silently ignored.
            - name: BOOTH_OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
          # /livez never touches PostgreSQL (a restart can't fix an outage); /healthz does, and
          # is what core polls.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          {{- $busCreds := and .Values.eventBus.enabled .Values.eventBus.credentialsSecret.enabled }}
          {{- if or .Values.core.url $busCreds }}
          volumeMounts:
            {{- if .Values.core.url }}
            # Token files and Unix sockets for the per-workspace sidecars: in memory, private to
            # this pod, gone when it stops (the root filesystem is read-only).
            - name: sidecars
              mountPath: /run/booth-api
            {{- end }}
            {{- if $busCreds }}
            # A directory mount, deliberately not a single-file (sub-path) mount: the kubelet updates
            # a mounted Secret in place when core renews the credential, but never a sub-path one.
            - name: event-bus-credentials
              mountPath: /etc/booth/event-bus
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if or .Values.core.url $busCreds }}
      volumes:
        {{- if .Values.core.url }}
        - name: sidecars
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        {{- end }}
        {{- if $busCreds }}
        - name: event-bus-credentials
          secret:
            secretName: {{ .Values.eventBus.credentialsSecret.name }}
            # Not `optional`: if booth-core hasn't written the credential the pod waits, visibly,
            # instead of starting without one and queueing events nobody publishes.
            items:
              - key: nats.creds
                path: nats.creds
        {{- end }}
      {{- end }}
