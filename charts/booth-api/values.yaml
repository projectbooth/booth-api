# Default values for booth-api.
#
# What this module is (ADR 0100): turns a catalog dataset into a read-only REST + GraphQL API,
# reachable by holders of an API key this module issues, hashes, scopes to datasets and revokes.
#
# Scaffold stage: the chart deploys the service, its BoothModule registration and its own
# database connection. The OIDC settings for its management API, the API-key path and the
# credential-sidecar wiring for reading workspace data (ADR 0095) are added when they are built.

replicaCount: 1

image:
  repository: ghcr.io/projectbooth/booth-api
  tag: "" # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

service:
  port: 8080

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources: {}

serviceAccount:
  create: true
  name: ""
