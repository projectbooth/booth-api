{{- if .Values.serviceAccount.create }}
# The module never calls the Kubernetes API, so the token is not mounted at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "booth-api.serviceAccountName" . }}
  labels:
    {{- include "booth-api.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
