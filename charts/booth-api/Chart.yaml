apiVersion: v2
name: booth-api
description: >
  Project Booth's API module: generated REST and GraphQL APIs over catalog datasets, read with API
  keys this module issues (ADR 0100), and written by apps an owner grants (ADR 0117).
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/projectbooth/booth-api

# ADR 0113 / contracts/module-manifest.md "Chart annotation: identity keys": tells booth-core's
# install API which of this chart's values.yaml paths carry the platform's shared identity settings,
# so an install through the install API (the Module Store's Install button included) is configured
# without hand-typed values. Core fills a mapped path only when the request doesn't set that leaf.
# coreUrl (amendment 1) fills core.url, which turns on generating APIs and reading workspace data.
# workloadIssuerUrl fills oidc.workloadIssuerUrl: app write tokens (ADR 0117) are verified against
# core's workload issuer. Omitted on purpose: iframeIssuerUrl (no iframe-proxied UI).
annotations:
  booth.projectbooth.io/identity-keys: |
    {"issuerUrl":"oidc.issuerUrl","clientId":"oidc.clientId","jwksUrl":"oidc.jwksUrl","groupsClaim":"oidc.groupsClaim","coreUrl":"core.url","workloadIssuerUrl":"oidc.workloadIssuerUrl"}
