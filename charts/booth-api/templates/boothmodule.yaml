# Registers booth-api with booth-core's module registry (ADR 0019, contracts/module-manifest.md).
#
# One native view under Manage (ADR 0017, contracts/ui-integration.md): pick a catalog dataset,
# generate its API, issue and revoke keys. UI package: @projectbooth/api-ui (web/).
#
# navPath is /apis, not /api: the shell and booth-core share an origin, and /api/* is core's own
# API (contracts/core-platform-api.md), so a shell route of /api would collide with it.
#
# `database: {enabled: true}` asks booth-core for this module's OWN database (ADR 0053), where API
# key hashes and generated-API definitions live. It is unrelated to the workspace databases
# booth-database provisions (ADR 0081), which generated APIs read but this module never owns.
apiVersion: booth.projectbooth.io/v1alpha1
kind: BoothModule
metadata:
  name: api
  labels:
    {{- include "booth-api.labels" . | nindent 4 }}
spec:
  id: api
  displayName: API
  icon: api
  version: {{ .Chart.AppVersion | quote }}
  contractVersion: "0.1.0"
  hasOwnUi: true
  uiIntegrationMode: native
  navGroup: manage
  navPath: /apis
  healthCheckPath: /healthz
  database:
    enabled: true
  # ADR 0101: core's gateway proxies /modules/api/public/v1/... here as /v1/... with no platform
  # login; booth-api authenticates every such request by API key (internal/public) and returns its
  # own 401/403. Core strips X-Booth-* on this route and booth-api never reads them there.
  publicRoutes:
    pathPrefixes:
      - /v1/
  {{- if .Values.core.url }}
  # ADR 0103: booth-api mints a workload token per workspace and key creator (subject
  # apikeys:<workspace>, roleCeiling viewer) for the credential sidecar that reads the workspace's
  # database. Core refuses a mint unless the creator holds a current role in that workspace. Only
  # declared with core.url, since the sidecar calls core's broker.
  workloadIdentity:
    mint: true
  {{- end }}
  serviceRef:
    name: {{ include "booth-api.fullname" . }}
    port: {{ .Values.service.port }}
